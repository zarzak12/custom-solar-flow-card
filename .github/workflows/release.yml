name: Attach release asset

on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Attach solar-flow-card.js to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/solar-flow-card.js
